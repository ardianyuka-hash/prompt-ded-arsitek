<style>
:root{
  --navy:#1f5137;--navy-2:#2b6a4a;--bg:#f1ece2;--card:#faf8f3;--line:#e2d9c8;
  --ink:#1c2620;--muted:#5b6b62;--accent:#9c6a2e;--accent-ink:#fff;--green:#2f7a52;
  --note:#e8dfd0;--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  --on-navy:#fff;--toast-bg:#1c2620;--toast-fg:#fff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141a17;--card:#1e2621;--line:#2f3b34;--ink:#e8ebef;--muted:#9aaba1;--note:#2a2620;--navy:#173d2a;--navy-2:#22573c;--toast-bg:#e8ebef;--toast-fg:#141a17;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#141a17;--card:#1e2621;--line:#2f3b34;--ink:#e8ebef;--muted:#9aaba1;--note:#2a2620;--navy:#173d2a;--navy-2:#22573c;--toast-bg:#e8ebef;--toast-fg:#141a17;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--navy);color:var(--on-navy);padding-block:18px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.install{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;padding:6px 12px;cursor:pointer;flex:0 0 auto}
[hidden]{display:none!important}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;opacity:.8;text-transform:uppercase}
h1{margin:2px 0 12px;font-size:22px;line-height:1.25}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:0;border-radius:8px;padding:7px 14px;background:rgba(255,255,255,.14);color:#fff;font-family:var(--mono);font-size:14px;cursor:pointer}
.tabs button.on{background:#fff;color:var(--navy)}
main{flex:1;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.item:hover{border-color:var(--accent)}
.code{flex:0 0 auto;background:var(--navy);color:#fff;font-family:var(--mono);font-size:13px;border-radius:6px;padding:4px 8px;min-width:62px;text-align:center}
.item b{display:block;line-height:1.3}
.item small{color:var(--muted);font-size:14px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:17px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:0}
.kv div{padding:7px 0;border-bottom:1px dashed var(--line)}
.kv div:nth-child(odd){color:var(--muted)}
.prompt{width:100%;min-height:260px;font-family:var(--mono);font-size:13.5px;line-height:1.6;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;resize:vertical;white-space:pre-wrap}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 auto;border:0;border-radius:12px;padding:14px 16px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;text-align:center;text-decoration:none;display:inline-block}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.green{background:var(--green)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.small{padding:10px 12px;font-size:14px;flex:0 1 auto}
.ai-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.ai-title{font-size:14px;color:var(--muted);margin-bottom:8px}
.ai-box .ai{flex:1 1 30%;text-align:center}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:0;margin-bottom:10px;cursor:pointer}
.opt{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.opt label{font-size:14px;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.note{background:var(--note);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:15px}
form .f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
form label{font-size:14px;color:var(--muted)}
form input,form select,form textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
form textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steps{list-style:none;padding:0;margin:0 0 12px;counter-reset:s}
.steps li{position:relative;padding:0 0 14px 46px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.steps b{display:block}
.steps span{color:var(--muted)}
.els{columns:2;column-gap:18px;padding-left:20px;margin:0;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--toast-bg);color:var(--toast-fg);padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:20;font-size:15px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sticky-actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:18px 0 10px;margin-top:6px}
@media (max-width:420px){.els{columns:1}.kv{grid-template-columns:96px 1fr}}
</style>
</head>

function loadMine(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}

let MINE=loadMine();
const all=()=>[...PRESETS,...MINE];

/* ===================== PROMPT BUILDER (CRAFT) ===================== */
const OPT={kertas:'A3 lanskap',bahasa:'Indonesia'};
const KERTAS={'A3 lanskap':'rasio lembar kertas A3 lanskap (√2 : 1)','A1 lanskap':'rasio lembar kertas A1 lanskap (√2 : 1)','16:9':'rasio layar 16:9 lanskap'};

function elemen(d){
  const n=+d.lantai||1;
  const el3 = n===1
    ? 'DENAH TAPAK (SITE PLAN) skala 1:200 — posisi bangunan di dalam lahan '+d.lahan+', garis sempadan, akses masuk, taman dan arah utara'

    'DENAH ATAP skala 1:100 — bentuk atap, arah kemiringan, talang dan dimensi keliling',

    'DETAIL ATAP skala 1:20 — lapisan penutup atap, reng, usuk/rangka, gording, talang, plafon, label tiap lapisan',

    'DETAIL PONDASI skala 1:20 — '+pondasi,

  ];

function buildPrompt(d,opt=OPT){
  const n=+d.lantai||1;
  const els=elemen(d).map((t,i)=>'('+(i+1)+') '+t).join('; ');
  const ruang=[];
  for(let i=0;i<n;i++){ if(d.ruang&&d.ruang[i]) ruang.push('Lantai '+(i+1)+': '+d.ruang[i]); }
  const lbl = opt.bahasa==='English'
    ? 'Semua label, judul panel dan isi tabel ditulis dalam bahasa Inggris.'
    : 'Semua label, judul panel dan isi tabel ditulis dalam bahasa Indonesia yang benar ejaannya.';
  return [
'[CONTEXT] Anda sedang menyiapkan satu lembar presentasi Detail Engineering Design (DED) arsitektur untuk proyek '+d.jenis+' di '+d.lokasi+', milik '+d.owner+', di atas lahan berukuran '+d.lahan+' dengan gaya arsitektur '+d.gaya+' dan jumlah '+n+' lantai. Atap: '+d.atap+'. Fasad: '+d.fasad+'.',
'[ROLE] Bertindaklah sebagai arsitek senior sekaligus drafter profesional Indonesia yang terbiasa menyusun gambar kerja rapi sesuai praktik studio arsitektur dan kaidah gambar teknik (SNI).',
'[ACTION] Buat SATU gambar lembar DED komposit yang memuat tepat 13 panel bernomor berikut: '+els+'.',
'[FORMAT] Susun ke-13 panel dalam grid 3 baris yang rapi: baris 1 berisi panel 1–4, baris 2 berisi panel 5–10, baris 3 berisi panel 11–13. Setiap panel diberi bingkai tipis, nomor dalam lingkaran dan judul panel beserta skalanya. Latar putih bersih; panel 1 berupa render berwarna, panel lainnya gambar teknik garis hitam tipis bergaya drafting arsitektur profesional Indonesia (garis dimensi dalam mm, leader line lurus, tabel bergaris rapi, teks terbaca). Gunakan '+(KERTAS[opt.kertas]||opt.kertas)+'. '+lbl+' Jika prompt ini dijalankan ulang, pertahankan tata letak grid dan ke-13 panel yang sama persis — variasi kecil pada gaya visual atau pencahayaan wajar, tetapi struktur dan kelengkapan panel tidak boleh berubah.',
'[TONE] Presisi, rapi, dan meyakinkan seperti dokumen kerja studio arsitektur profesional — bukan sketsa kasar atau moodboard.',
'',
'[RINCIAN RUANG PER LANTAI] '+(ruang.join(' | ')||'-')
  ].join('\n');
}

/* ===================== UI HELPERS ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1900)}
async function copyText(txt){
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);toast('Prompt tersalin ✓');return} }catch(e){}
  const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  ta.remove();toast(ok?'Prompt tersalin ✓':'Gagal menyalin — tekan lama teks lalu Salin');
}
async function sharePrompt(txt,title){
  if(navigator.share){try{await navigator.share({title,text:txt});return}catch(e){if(e.name==='AbortError')return}}
  copyText(txt);
}

/* ===================== STATE & ROUTING ===================== */
const S={tab:'preset',cat:'ALL',q:'',detail:null,editing:null};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.detail=null;render();window.scrollTo(0,0)});

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const m=$('#main');
  if(S.tab==='preset') m.innerHTML = S.detail ? viewDetail() : viewList();
  else if(S.tab==='buat') m.innerHTML = viewForm();
  else m.innerHTML = viewGuide();
  bind();
}

/* ---------- LIST ---------- */
function viewList(){
  const cats=['ALL',...Object.keys(CATS).filter(k=>k!=='MY'||MINE.length)];
  const q=S.q.toLowerCase();
  const items=all().filter(p=>(S.cat==='ALL'||p.cat===S.cat)&&(!q||[p.kode,p.nama,p.gaya,p.lokasi,p.jenis].join(' ').toLowerCase().includes(q)));
  const count=k=>k==='ALL'?all().length:all().filter(p=>p.cat===k).length;
  return `<h2>Pilih preset</h2><p class="sub">Ketuk salah satu preset — prompt lengkap tersusun otomatis.</p>
  <input class="search" id="q" type="search" placeholder="Cari gaya, kota, ukuran…" value="${esc(S.q)}">
  <div class="chips">${cats.map(k=>`<button class="chip ${S.cat===k?'on':''}" data-cat="${k}">${k==='ALL'?'Semua':CATS[k]} (${count(k)})</button>`).join('')}</div>
  <div class="list">${items.length?items.map(p=>`<button class="item" data-open="${esc(p.kode)}"><span class="code">${esc(p.kode)}</span><span><b>${esc(p.nama)}</b><small>${esc(p.gaya)} · ${p.lantai} lt · ${esc(p.lokasi)}</small></span></button>`).join(''):'<div class="empty">Tidak ada preset yang cocok.</div>'}</div>`;
}

/* ---------- DETAIL ---------- */
function viewDetail(){
  const d=all().find(p=>p.kode===S.detail); if(!d){S.detail=null;return viewList()}
  const n=+d.lantai;
  const rows=[['Jenis',d.jenis],['Owner',d.owner],['Lokasi',d.lokasi],['Lahan',d.lahan],['Gaya',d.gaya],['Lantai',n+' lantai'],['Atap',d.atap],['Fasad',d.fasad]];
  for(let i=0;i<n;i++) rows.push(['Ruang Lt.'+(i+1),d.ruang[i]||'-']);
  const isMine=d.cat==='MY';
  return `<button class="back" data-back>‹ Kembali ke daftar</button>
  <div class="card"><h3>${esc(d.kode)} · ${esc(d.nama)}</h3><div class="kv">${rows.map(r=>`<div>${esc(r[0])}</div><div>${esc(r[1])}</div>`).join('')}</div></div>
  ${optionsHTML()}
  <textarea class="prompt" id="promptOut" readonly>${esc(buildPrompt(d))}</textarea>
  <div class="note">Tempel prompt di aplikasi AI (mis. Claude, ChatGPT, Gemini). Hasil bisa sedikit berbeda tiap generate, tetapi tata letak dan ke-13 panel tetap sama.</div>
  ${aiLinks()}
  <div class="row" style="margin-bottom:10px">
    <button class="btn ghost small" data-edit="${esc(d.kode)}">${isMine?'Ubah preset':'Ubah data (salin ke formulir)'}</button>
    ${isMine?`<button class="btn ghost small" data-del="${esc(d.kode)}">Hapus</button>`:''}
  </div>
  <div class="sticky-actions row">
    <button class="btn" data-share>Bagikan</button>
    <button class="btn accent" data-copy style="flex:2">Salin Prompt Lengkap</button>
  </div>`;
}
const AI=[['Claude','https://claude.ai/new'],['ChatGPT','https://chatgpt.com/'],['Gemini','https://gemini.google.com/']];
function aiLinks(){
  return `<div class="ai-box"><div class="ai-title">Salin prompt &amp; buka aplikasi AI</div><div class="row">${AI.map(([n,u])=>`<a class="btn ghost small ai" data-ai="${n}" href="${u}" target="_blank" rel="noopener">Buka ${n}</a>`).join('')}</div></div>`;
}
function optionsHTML(){
  return `<div class="card">
    <div class="opt"><label>Format lembar</label><div class="seg">${Object.keys(KERTAS).map(k=>`<button data-kertas="${k}" class="${OPT.kertas===k?'on':''}">${k}</button>`).join('')}</div></div>
    <div class="opt" style="margin:0"><label>Bahasa label gambar</label><div class="seg">${['Indonesia','English'].map(k=>`<button data-bahasa="${k}" class="${OPT.bahasa===k?'on':''}">${k}</button>`).join('')}</div></div>
  </div>`;
}

/* ---------- FORM ---------- */
const EMPTY={kode:'',cat:'MY',nama:'',jenis:'',lokasi:'',owner:'',lahan:'',gaya:'',lantai:2,atap:'',fasad:'',ruang:['','','']};
let F={...EMPTY,ruang:[...EMPTY.ruang]};
function viewForm(){
  const n=+F.lantai;
  const fld=(k,l,ph)=>`<div class="f"><label for="f_${k}">${l}</label><input id="f_${k}" data-f="${k}" value="${esc(F[k])}" placeholder="${ph}"></div>`;
  return `<h2>${S.editing?'Ubah preset saya':'Prompt Buatan Sendiri'}</h2>
  <p class="sub">Isi data proyek. Struktur 13 panel tetap, hanya data proyek yang berganti.</p>
  <form id="form" onsubmit="return false">
    ${fld('nama','Nama proyek','Rumah 2 Lantai Tropis 8x15')}
    ${fld('jenis','Jenis bangunan','Rumah tinggal / Ruko / Villa')}
    <div class="grid2">${fld('lokasi','Lokasi','Bandung')}${fld('lahan','Ukuran lahan','8 x 15 m')}</div>
    ${fld('owner','Owner / pengguna','Keluarga 4 orang')}
    <div class="grid2">${fld('gaya','Gaya arsitektur','Tropis modern')}
      <div class="f"><label for="f_lantai">Jumlah lantai</label><select id="f_lantai" data-f="lantai">${[1,2,3].map(i=>`<option ${n===i?'selected':''}>${i}</option>`).join('')}</select></div></div>
    ${fld('atap','Atap','Atap pelana genteng beton')}
    ${fld('fasad','Fasad','Plester putih + aksen kayu')}
    ${[0,1,2].slice(0,n).map(i=>`<div class="f"><label for="f_r${i}">Ruang lantai ${i+1}</label><textarea id="f_r${i}" data-r="${i}" placeholder="Pisahkan dengan koma: Teras, R. Tamu, Dapur…">${esc(F.ruang[i])}</textarea></div>`).join('')}
  </form>
  ${optionsHTML()}
  <textarea class="prompt" id="promptOut" readonly>${esc(buildPrompt(fillDefaults(F)))}</textarea>
  <div style="margin-top:10px">${aiLinks()}</div>
  <div class="row" style="margin-top:10px"><button class="btn ghost small" data-reset>Kosongkan</button><button class="btn green" data-save>${S.editing?'Simpan perubahan':'Simpan ke Preset Saya'}</button></div>
  <div class="sticky-actions row"><button class="btn" data-share>Bagikan</button><button class="btn accent" data-copy style="flex:2">Salin Prompt Lengkap</button></div>`;
}
function fillDefaults(f){
  const g=(v,d)=>(v&&String(v).trim())||d;
  return {...f,nama:g(f.nama,'[nama proyek]'),jenis:g(f.jenis,'[jenis bangunan]'),lokasi:g(f.lokasi,'[lokasi]'),owner:g(f.owner,'[owner]'),
    lahan:g(f.lahan,'[ukuran lahan]'),gaya:g(f.gaya,'[gaya arsitektur]'),atap:g(f.atap,'[jenis atap]'),fasad:g(f.fasad,'[material fasad]'),
    ruang:f.ruang.map(r=>g(r,'[daftar ruang]'))};
}

/* ---------- GUIDE ---------- */
function viewGuide(){
  const els=['Tampak depan (render 3D)','Denah lantai 1','Denah lt.2 / lt.2&3 / site plan','Denah atap','Potongan A-A','Tampak samping','Detail atap','Detail dinding','Detail pondasi','Tabel spesifikasi material','Tabel ruang','Catatan','Kop gambar'];
  return `<h2>Cara pakai</h2><p class="sub">Satu file HTML, bisa dibuka di HP tanpa instal aplikasi dan tetap jalan offline.</p>
  <ol class="steps">
    <li><b>Pilih preset</b><span>Ada ${PRESETS.length} preset dalam 5 kategori: 1 lantai, 2 lantai, 3 lantai & hook, villa, dan ruko/usaha. Atau isi tab Buat Sendiri.</span></li>
    <li><b>Atur & salin</b><span>Pilih format lembar dan bahasa label, lalu ketuk <i>Salin Prompt Lengkap</i>.</span></li>
    <li><b>Tempel di AI pembuat gambar</b><span>Ketuk <i>Buka Claude</i>, <i>Buka ChatGPT</i>, atau <i>Buka Gemini</i> — prompt otomatis tersalin. Tempel di kolom chat, lalu kirim.</span></li>
    <li><b>Simpan hasil</b><span>Unduh gambar, perbesar untuk cek teks dan angka. Jika ada panel kurang, minta AI "lengkapi panel nomor …".</span></li>
  </ol>
  <div class="card"><h3>Struktur prompt (CRAFT)</h3><p style="margin:0">Context · Role · Action (13 panel tetap) · Format · Tone. Hanya data proyek yang berganti, susunan lembar selalu sama.</p></div>
  <div class="card"><h3>Isi 13 panel</h3><ol class="els">${els.map(e=>`<li>${e}</li>`).join('')}</ol></div>
  <div class="note"><b>Penting:</b> gambar dari AI adalah ilustrasi/konsep presentasi. Angka, dimensi, dan detail struktur bisa keliru — untuk IMB/PBG dan pelaksanaan tetap gunakan gambar kerja yang diperiksa arsitek dan insinyur struktur berlisensi.</div>
  <div class="card"><h3>Pasang sebagai aplikasi</h3><p style="margin:0"><b>Android (Chrome):</b> ketuk tombol <i>Pasang di HP</i> di atas, atau menu ⋮ → <i>Tambahkan ke layar utama / Instal aplikasi</i>.<br><b>iPhone (Safari):</b> ketuk tombol Bagikan → <i>Tambah ke Layar Utama</i>.<br>Setelah terpasang, aplikasi muncul sebagai ikon di HP dan tetap bisa dipakai tanpa internet. Preset buatan sendiri tersimpan di HP masing-masing.</p></div>`;
}

/* ===================== EVENTS ===================== */
function currentPrompt(){return $('#promptOut')?.value||''}
function refreshPrompt(){
  const out=$('#promptOut'); if(!out) return;
  if(S.tab==='buat') out.value=buildPrompt(fillDefaults(F));
  else { const d=all().find(p=>p.kode===S.detail); if(d) out.value=buildPrompt(d); }
}
function bind(){
  const m=$('#main');
  const q=$('#q'); if(q) q.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
  m.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;render()});
  m.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.detail=b.dataset.open;render();window.scrollTo(0,0)});
  m.querySelector('[data-back]')?.addEventListener('click',()=>{S.detail=null;render()});
  m.querySelectorAll('[data-kertas]').forEach(b=>b.onclick=()=>{OPT.kertas=b.dataset.kertas;m.querySelectorAll('[data-kertas]').forEach(x=>x.classList.toggle('on',x===b));refreshPrompt()});
  m.querySelectorAll('[data-bahasa]').forEach(b=>b.onclick=()=>{OPT.bahasa=b.dataset.bahasa;m.querySelectorAll('[data-bahasa]').forEach(x=>x.classList.toggle('on',x===b));refreshPrompt()});
  m.querySelector('[data-copy]')?.addEventListener('click',()=>copyText(currentPrompt()));
  m.querySelectorAll('[data-ai]').forEach(a=>a.addEventListener('click',()=>{copyText(currentPrompt());setTimeout(()=>toast('Prompt tersalin — tempel di '+a.dataset.ai),300)}));
  m.querySelector('[data-share]')?.addEventListener('click',()=>sharePrompt(currentPrompt(),'Prompt DED Arsitektural 2027'));
  m.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
    const d=all().find(p=>p.kode===b.dataset.edit);
    F={...d,ruang:[...d.ruang,'','',''].slice(0,3)};
    S.editing=d.cat==='MY'?d.kode:null;
    if(!S.editing){F.cat='MY';F.nama=d.nama+' (salinan)'}
    S.tab='buat';S.detail=null;render();window.scrollTo(0,0);
  });
  m.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Ketuk lagi untuk hapus';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Hapus'}},3000);return}
    MINE=MINE.filter(p=>p.kode!==b.dataset.del);saveMine(MINE);S.detail=null;if(!MINE.length&&S.cat==='MY')S.cat='ALL';render();toast('Preset dihapus');
  });
  // form
  m.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('input',e=>{
    const k=el.dataset.f;F[k]=k==='lantai'?+el.value:el.value;
    if(k==='lantai'){render();return}
    refreshPrompt();
  }));
  m.querySelectorAll('[data-r]').forEach(el=>el.addEventListener('input',()=>{F.ruang[+el.dataset.r]=el.value;refreshPrompt()}));
  m.querySelector('[data-reset]')?.addEventListener('click',()=>{F={...EMPTY,ruang:['','','']};S.editing=null;render()});
  m.querySelector('[data-save]')?.addEventListener('click',()=>{
    if(!F.nama.trim()){toast('Isi nama proyek dulu');$('#f_nama').focus();return}
    const rec={...fillDefaults(F),cat:'MY',lantai:+F.lantai,ruang:F.ruang.slice(0,+F.lantai)};
    if(S.editing){rec.kode=S.editing;MINE=MINE.map(p=>p.kode===S.editing?rec:p)}
    else{let i=MINE.length+1,k;do{k='MY-'+String(i++).padStart(2,'0')}while(MINE.some(p=>p.kode===k));rec.kode=k;MINE.push(rec)}
    const ok=saveMine(MINE);
    S.tab='preset';S.cat='MY';S.detail=rec.kode;S.editing=null;F={...EMPTY,ruang:['','','']};render();window.scrollTo(0,0);
    toast(ok?'Tersimpan di Preset Saya ✓':'Tersimpan sementara (browser tidak mengizinkan penyimpanan)');
  });
}
render();

/* ===================== PWA ===================== */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').hidden=false});
$('#installBtn').onclick=async()=>{
  if(!deferredInstall)return;
  deferredInstall.prompt();
  const r=await deferredInstall.userChoice.catch(()=>null);
  deferredInstall=null;$('#installBtn').hidden=true;
  if(r&&r.outcome==='accepted')toast('Aplikasi dipasang ✓');
};
window.addEventListener('appinstalled',()=>{$('#installBtn').hidden=true});
</script>
